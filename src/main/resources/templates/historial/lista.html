<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosmar — Historial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .navbar {
            background: #1F3864; color: white;
            padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .navbar h1 { font-size: 18px; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; }
        .container { padding: 24px; max-width: 1100px; margin: 0 auto; }
        h2 { color: #1F3864; margin-bottom: 16px; }
        .card {
            background: white; border-radius: 8px;
            padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .filtros {
            display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
        }
        .filtros div { display: flex; flex-direction: column; gap: 4px; }
        .filtros label { font-size: 13px; color: #555; font-weight: bold; }
        .filtros input {
            padding: 8px 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 13px;
        }
        .btn {
            padding: 8px 16px; border-radius: 6px;
            border: none; cursor: pointer; font-size: 13px;
            text-decoration: none; display: inline-block;
        }
        .btn-primary { background: #1F3864; color: white; }
        .btn-primary:hover { background: #2E75B6; }
        .btn-secondary { background: #eee; color: #333; }
        .btn-secondary:hover { background: #ddd; }
        .btn-success { background: #1E6B3C; color: white; }
        .btn-success:hover { background: #155230; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: #1F3864; color: white;
            padding: 10px 12px; text-align: left;
        }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        tr:hover td { background: #f9f9f9; }
        .empty { text-align: center; color: #888; padding: 40px; }
        .alert-success {
            background: #d9ead3; color: #1E6B3C;
            padding: 12px 16px; border-radius: 6px;
            font-size: 14px; margin-bottom: 16px;
        }
        .acciones { display: flex; gap: 8px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>Rosmar — Consultoría de Sanidad</h1>
    <a th:href="@{/dashboard}">← Volver al inicio</a>
</div>
<div class="container">
    <h2>Historial de Registros SSOP</h2>

    <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

    <!-- Filtros -->
    <div class="card">
        <form th:action="@{/historial}" method="get" class="filtros">
            <div>
                <label>Fecha inicio</label>
                <input type="date" name="inicio" th:value="${inicio}">
            </div>
            <div>
                <label>Fecha fin</label>
                <input type="date" name="fin" th:value="${fin}">
            </div>
            <button type="submit" class="btn btn-primary">Filtrar</button>
            <a th:href="@{/historial}" class="btn btn-secondary">Limpiar</a>
            <a th:href="@{/exportar/excel}"
               sec:authorize="hasRole('SUPERVISOR')"
               class="btn btn-success">Exportar Excel</a>
        </form>
    </div>

    <!-- Tabla -->
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Folio</th>
                <th>Fecha</th>
                <th>Registrado por</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="4" class="empty">No hay registros disponibles.</td>
            </tr>
            <tr th:each="reg : ${registros}">
                <td th:text="${reg.id}"></td>
                <td th:text="${reg.fecha}"></td>
                <td th:text="${reg.registradoPor.nombre + ' ' + reg.registradoPor.apellido}"></td>
                <td>
                    <div class="acciones">
                        <a th:href="@{/historial/{id}(id=${reg.id})}"
                           class="btn btn-primary btn-sm">Ver detalle</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
