# Base de datos
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/rosmar_digitalizacion}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD}}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Anthropic API
anthropic.api.key=${ANTHROPIC_API_KEY}

# Servidor
server.port=${PORT:8080}